name: Build Desktop - Windows, Linux & macOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build flavor'
        required: true
        type: choice
        options:
          - release
          - debug
        default: 'release'
  workflow_call:
    inputs:
      build_type:
        description: 'Build flavor'
        required: false
        type: string
        default: 'release'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.platform_name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_name: 'Windows x64'
            artifact_name: 'windows-x64'
            args: '--bundles nsis'
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform_name: 'Linux x64'
            artifact_name: 'linux-x64'
            args: '--bundles deb,appimage'
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_name: 'macOS Apple Silicon'
            artifact_name: 'macos-arm64'
            args: '--bundles dmg'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux System Dependencies for Tauri 2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ''

      - name: Organize Desktop Release Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*" -Include "*.exe","*.zip","*.sig" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist-artifacts/"
            Write-Host "Collected Windows NSIS installer / updater: $($_.Name)"
          }
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*" -Include "*.msi","*.zip","*.sig" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist-artifacts/"
            Write-Host "Collected Windows MSI package / updater: $($_.Name)"
          }
          Get-ChildItem -Path "src-tauri/target/release/bundle/updater/*" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist-artifacts/"
            Write-Host "Collected updater manifest / artifact: $($_.Name)"
          }

      - name: Organize Desktop Release Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/updater/ -type f -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/

      - name: Organize Desktop Release Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle/dmg/ -name "*.dmg" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/updater/ -type f -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/

      - name: Upload ${{ matrix.platform_name }} Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-${{ matrix.artifact_name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 14
